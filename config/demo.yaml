# Demo profile with a realistic balance (5,000 USD demo account). Normal risk limits.
version: 1
account:
  symbol: XAUUSDm
  environment: demo
  account_type: standard
session:
  dst_mode: auto
  pre_break_buffer_min: 15
strategies:
  - id: trend_atr_v1
    kind: trend_atr
    enabled: true
    mode: shadow
    # D-073: stop 5.5 and target 16.5 x the 1-minute ATR (was 1.0 and 1.5). 5.5 leaves room
    # under the limit of 6.0 for the gateway's own ATR reading.
    params: {ema_fast: 20, ema_slow: 50, atr_period: 14, stop_atr: 5.5, target_atr: 16.5}
    stop_atr_max: 6.0
owner:
  profile: normal
  mode: demo
  # D-068: take up to 3 of the rule's signals a day on the demo account even when the Strategy
  # agent declines them, at least 4 hours apart. Every code gate and risk limit still applies.
  code_only_demo_trades_per_day: 3
  code_only_min_gap_minutes: 240
  risk:
    risk_per_trade_pct: 0.5
    daily_loss_pct: 2.0
    weekly_loss_pct: 4.0
    max_drawdown_pct: 10.0
    max_positions: 1
    max_volume_lots: 0.01
    max_spread_pips: 60
    # D-073: stops up to 6 x the 1-minute ATR (was 1.5). At 0.01 lot that is about 11-16 USD
    # a losing trade, inside risk_per_trade_pct (25 USD on 5,000).
    stop_atr_max: 6.0
