[project]
name = "goldtrader"
version = "0.1.0"
description = "AI gold (XAUUSD) trading system for Exness via MetaTrader 5"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "typer>=0.12",
  "pyarrow>=17",
]

[project.optional-dependencies]
windows = ["MetaTrader5>=5.0.4000; sys_platform == 'win32'"]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
goldctl = "goldtrader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldtrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4"]
ignore = ["B905", "E501", "C408"]   # zip strict noise; line length handled by ruff format

[tool.ruff.lint.per-file-ignores]
"src/goldtrader/cli.py" = ["B008"]   # typer's documented idiom uses calls in defaults
